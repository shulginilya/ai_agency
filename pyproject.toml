[project]
name = "agency"
version = "0.1.0"
description = "Agentic development harness built on the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The HTTP surface is optional: `agency run` and the eval suite must keep working in an
# image with no web stack installed. `agency serve` prints an install hint if it is
# missing rather than failing with an ImportError.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Persistence is optional, like the API. `agency run`, the eval suite and every unit
# test must keep working in an image with no database driver installed -- `[db]` is what
# the server and the capability admin surface need, not what the harness needs to run.
db = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
]
# The Postgres driver is a separate extra so a SQLite-only deployment does not build it.
postgres = [
    "agency[db]",
    "asyncpg>=0.29",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    # httpx drives the API tests over ASGI transport -- no socket, no live server.
    "httpx>=0.27",
    "agency[api]",
    "agency[db]",
    "agency[postgres]",
]

[project.scripts]
agency = "agency.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; `alembic revision --autogenerate` emits one long sa.Column(...)
# per line and does not wrap. Hand-wrapping them means the next autogenerate reintroduces
# the same errors, so this is churn forever rather than a style decision. Only the line
# length is waived -- everything else still applies, including to migrations/env.py,
# which is hand-written and not covered here.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agency", "evals"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." (repo root) is required so `evals` is importable -- test_scorers.py imports
# evals.scorers. Without it, tests only pass by accident when invoked via
# `python -m pytest` (which happens to prepend cwd to sys.path); running the
# `pytest` console script directly fails collection with ModuleNotFoundError.
pythonpath = ["src", "."]
