name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src evals
      - run: uv run pytest -q
  # Evals hit the API and cost money, so they run on demand rather than on every push.
  # Add ANTHROPIC_API_KEY as a repo secret and uncomment to enable.
